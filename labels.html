<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="auth.js"></script>
<title>מדבקות שמות לתלמידים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@400;700&family=Rubik:wght@400;700&family=Secular+One&family=Varela+Round&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1f2a37;--mute:#6b7280;--line:#e3e7ed;--pri:#1d5fa8;--pri2:#e7f0fb;--ok:#15803d;--okb:#e7f6ec;--warn:#a15c07;--warnb:#fdf3e2;--bad:#b91c1c;--badb:#fde8e8}
*{box-sizing:border-box}
body{margin:0;font-family:Assistant,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--pri);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:22px}
header small{opacity:.8}
header .sp{margin-right:auto;display:flex;gap:8px}
.wrap{display:grid;grid-template-columns:460px 1fr;gap:18px;padding:18px;max-width:1500px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;align-self:start}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fafbfd}
.tabs button{flex:1;border:0;background:none;padding:13px 4px;font:inherit;font-weight:700;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
.tabs button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e5e9ef;font-size:13px;margin-left:5px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);background:#fff}
.tabs button.on .n{background:var(--pri);color:#fff}
.body{padding:18px}
h3{margin:0 0 10px;font-size:18px}
h4{margin:18px 0 8px;font-size:15px;color:var(--pri)}
label{display:block;font-size:14px;color:var(--mute);font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #cdd4dd;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc0ea;border-color:var(--pri)}
textarea{resize:vertical;min-height:180px;line-height:1.6}
.f{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.big{font-size:18px;padding:13px 22px}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f1c4c4}
.btn:disabled{opacity:.5;cursor:default}
header .btn{background:rgba(255,255,255,.15);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit;font-weight:600}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.add{border-style:dashed;color:var(--pri)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:#fff;padding:10px;font:inherit;font-weight:700;cursor:pointer;color:var(--mute);border-left:1px solid var(--line)}
.seg button:last-child{border-left:0}
.seg button.on{background:var(--pri);color:#fff}
.seg button small{display:block;font-weight:400;font-size:12px;opacity:.85}
.hint{font-size:13px;color:var(--mute);margin:-4px 0 10px;line-height:1.5}
.note{padding:10px 12px;border-radius:9px;font-size:14px;margin:8px 0;line-height:1.5}
.n-warn{background:var(--warnb);color:var(--warn)} .n-ok{background:var(--okb);color:var(--ok)} .n-info{background:var(--pri2);color:var(--pri)} .n-bad{background:var(--badb);color:var(--bad)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:8px}
.emojis button{font-size:22px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 0;cursor:pointer;line-height:1.3}
.emojis button.on{border-color:var(--pri);background:var(--pri2);box-shadow:0 0 0 2px var(--pri) inset}
.preview{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:400px}
.pvtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pvtop h3{margin:0}
.bigpage{display:flex;justify-content:center;background:#e9edf2;border-radius:10px;padding:18px}
.bigpage canvas{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:100%;height:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:14px}
.thumb{cursor:pointer;text-align:center;font-size:12px;color:var(--mute)}
.thumb canvas{width:100%;height:auto;background:#fff;border:2px solid transparent;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.thumb.on canvas{border-color:var(--pri)}
.thumb div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.stat div{background:var(--pri2);border-radius:10px;padding:10px 14px;flex:1;min-width:110px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--pri)}
.prog{height:10px;background:#e5e9ef;border-radius:6px;overflow:hidden;margin:10px 0}
.prog div{height:100%;background:var(--pri);width:0;transition:width .15s}
.studlist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.studlist label{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:400;margin:0;padding:3px 4px}
.studlist input{width:auto}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:600;margin-bottom:10px;cursor:pointer}
.check input{width:auto;transform:scale(1.2)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:20}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:22px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.imgprev{width:44px;height:44px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  header,.wrap,.modal,.toast{display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:21cm;height:29.7cm;page-break-after:always;break-after:page}
  #printArea img:last-child{page-break-after:auto;break-after:auto}
}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a href="index.html" title="לדף הבית" style="font-size:30px;text-decoration:none">🏷️</a>
  <div><h1>מדבקות שמות לתלמידים</h1><small>מגדירים כיתה ← כותבים כמה מדבקות בדף ← מעצבים ← מדפיסים</small></div>
  <div class="sp"><button class="btn" onclick="backup()">💾 גיבוי</button><button class="btn" onclick="$('#restoreIn').click()">📂 שחזור</button><button class="btn" onclick="showHelp()">❓ עזרה</button>
  <input type="file" id="restoreIn" accept=".json" hidden></div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="body" id="body"></div>
  </div>
  <div class="preview">
    <div class="pvtop"><h3>תצוגה מקדימה</h3><span class="muted" id="pvInfo" style="color:var(--mute)"></span>
      <div style="margin-right:auto" class="row"><button class="btn sec" onclick="go(3)">🖨️ להדפסה ←</button></div></div>
    <div class="bigpage"><canvas id="big"></canvas></div>
    <div class="thumbs" id="thumbs"></div>
  </div>
</div>

<div id="printArea"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===================== נתונים =====================
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)};
const uid=()=>Math.random().toString(36).slice(2,9);
// פריסה אוטומטית: לפי מספר המדבקות בדף בוחרים עמודות ושורות, וגודל המדבקה ממלא את הדף
function bestCols(n){let best=1,score=1e9;
 for(let c=1;c<=12&&c<=n;c++){const r=Math.ceil(n/c),asp=(21/c)/(29.7/r);
  const sc=Math.abs(Math.log(asp/2))+(c*r!==n?1:0)+(asp<0.8?2:0);if(sc<score){score=sc;best=c}}
 return best}
function autoSize(s){s.rows=Math.ceil(s.count/s.cols);
 s.w=+Math.max(0.5,(21-2*s.side-(s.cols-1)*s.gapX)/s.cols).toFixed(2);
 s.h=+Math.max(0.5,(29.7-2*s.top-(s.rows-1)*s.gapY)/s.rows).toFixed(2)}
const EMOJIS=["⭐","🌟","✏️","📚","📖","🍎","🎈","🌈","☀️","🌙","🌸","🌻","🌳","🍀","🐝","🦋","🐠","🐻","🦁","🐘","🐢","🚀","🚂","⚽","🎨","🎵","🏫","✡️","🕎","💙","❤️","💚"];
const FONTS=[["Assistant","אסיסטנט (רגיל)"],["Heebo","היבו"],["Rubik","רוביק (עגול)"],["Varela Round","ורלה (עגול וברור)"],["Secular One","סקולר (כותרת עבה)"],["Amatic SC","אמטיק (כתב יד)"]];
const DEF={
  classes:[{id:"c1",name:"כיתה א'1",students:["יוסף כהן","משה לוי","אברהם פרידמן","דוד גולדברג","שמואל רוזנטל","יעקב שטרן"],icon:{type:"emoji",value:"⭐"}}],
  cur:"c1",
  sheet:{count:30,cols:3,rows:10,w:7.0,h:2.97,top:0,side:0,gapX:0,gapY:0,auto:true,paper:"A4",offX:0,offY:0},
  design:{font:"Varela Round",bold:true,color:"#1b2a4a",maxSize:55,iconPos:"right",iconSize:70,showClass:false,border:false,borderColor:"#9aa7b8",align:"center"},
  print:{each:0,fill:"blank",general:0,generalType:"class",generalText:"",dpi:250,only:null}
};
let S;
try{S=JSON.parse(localStorage.getItem("labelsApp")||"null")}catch(e){}
if(!S||!S.classes)S=structuredClone(DEF);
for(const k of ["sheet","design","print"])S[k]={...DEF[k],...S[k]};
if(!S.sheet.count)S.sheet.count=(S.sheet.cols*S.sheet.rows)||30;
if(S.print.mode){delete S.print.mode;S.print.each=0;S.print.fill="blank";S.print.general=0}
const save=()=>{try{localStorage.setItem("labelsApp",JSON.stringify(S))}catch(e){toast("שימו לב: לא ניתן לשמור בדפדפן (ייתכן שהתמונה גדולה מדי)")}};
const cls=()=>S.classes.find(c=>c.id==S.cur)||S.classes[0];

// ===================== טאבים =====================
let tab=0;
const TABS=["כיתות","סוג הדף","עיצוב","הדפסה"];
function go(i){tab=i;renderPanel()}
function renderPanel(){
  $("#tabs").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="go(${i})"><span class="n">${i+1}</span>${t}</button>`).join("");
  $("#body").innerHTML=[pClasses,pSheet,pDesign,pPrint][tab]();
  (A[tab]||(()=>{}))();
  schedulePreview();
}
const A={};

// ---------- 1. כיתות ----------
function pClasses(){const c=cls();
 return `<h3>הכיתות שלי</h3>
 <div class="chips">${S.classes.map(k=>`<button class="chip ${k.id==c.id?'on':''}" onclick="S.cur='${k.id}';save();renderPanel()">${esc(k.name)} <small>(${k.students.length})</small></button>`).join("")}
 <button class="chip add" onclick="addClass()">+ כיתה חדשה</button></div>
 <div class="f"><label>שם הכיתה</label><input id="cName" value="${esc(c.name)}"></div>
 <div class="f"><label>שמות התלמידים – שם אחד בכל שורה</label>
 <div class="hint">אפשר להעתיק עמודה מאקסל ולהדביק כאן ישירות.</div>
 <textarea id="cStud" placeholder="יוסף כהן&#10;משה לוי&#10;...">${esc(c.students.join("\n"))}</textarea></div>
 <div class="row" style="margin-bottom:6px"><span id="cCount" style="color:var(--mute)"></span>
  <button class="btn ghost" style="margin-right:auto" onclick="sortStud()">מיון א-ב</button></div>
 <h4>ייבוא מקובץ</h4>
 <div class="hint">קובץ אקסל (xlsx) או CSV. המערכת מזהה עמודת "שם" (או "שם פרטי" + "שם משפחה"). אם יש עמודת "כיתה" – ייווצרו כמה כיתות בבת אחת.</div>
 <div class="row"><button class="btn sec" onclick="$('#fileIn').click()">📥 ייבוא מאקסל / CSV</button><input type="file" id="fileIn" accept=".xlsx,.xls,.csv,.txt" hidden>
 <button class="btn danger" style="margin-right:auto" onclick="delClass()">🗑 מחיקת הכיתה</button></div>`}
A[0]=()=>{
 const upd=()=>{const c=cls();c.name=$("#cName").value.trim()||"כיתה";c.students=$("#cStud").value.split(/\r?\n/).map(s=>s.replace(/\t.*/,"").trim()).filter(Boolean);
  $("#cCount").textContent=`${c.students.length} תלמידים`;save();schedulePreview()};
 $("#cName").oninput=()=>{upd();document.querySelector(".chip.on").firstChild.textContent=$("#cName").value+" "};
 $("#cStud").oninput=upd; upd();
 $("#fileIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importFile(f)};
};
function addClass(){const id=uid();S.classes.push({id,name:"כיתה חדשה",students:[],icon:{type:"emoji",value:"⭐"}});S.cur=id;save();renderPanel();setTimeout(()=>$("#cName").select(),50)}
function delClass(){if(S.classes.length<2){toast("חייבת להישאר לפחות כיתה אחת");return}
 confirmBox(`למחוק את "${esc(cls().name)}" עם כל התלמידים?`,()=>{S.classes=S.classes.filter(c=>c.id!=S.cur);S.cur=S.classes[0].id;save();renderPanel()})}
function sortStud(){const c=cls();c.students.sort((a,b)=>a.localeCompare(b,"he"));save();renderPanel()}

// ייבוא קבצים
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)})}
async function importFile(f){
 let rows;
 try{
  if(/\.(xlsx|xls)$/i.test(f.name)){
   if(!window.XLSX){toast("טוען רכיב אקסל…");await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")}
   const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
  }else{
   let txt=await f.text();if(txt.includes("�")){txt=new TextDecoder("windows-1255").decode(await f.arrayBuffer())}
   rows=parseCSV(txt);
  }
 }catch(e){toast("לא הצלחתי לקרוא את הקובץ. אפשר להעתיק את העמודה מאקסל ולהדביק.");return}
 rows=rows.map(r=>r.map(x=>String(x??"").trim())).filter(r=>r.some(Boolean));
 if(!rows.length){toast("הקובץ ריק");return}
 const h=rows[0].map(x=>x.replace(/["']/g,""));
 const fi=h.findIndex(x=>/שם\s*פרטי|^פרטי$|first/i.test(x)), li=h.findIndex(x=>/שם\s*משפחה|^משפחה$|last/i.test(x));
 let ni=h.findIndex(x=>/^שם(\s*(מלא|התלמיד|תלמיד))?$|name|תלמיד/i.test(x)&&!/פרטי|משפחה|כיתה/.test(x));
 const ci=h.findIndex(x=>/כיתה|class/i.test(x));
 const hasHeader=fi>=0||li>=0||ni>=0||ci>=0;
 if(ni<0&&fi<0)ni=ci==0?1:0;
 const data=hasHeader?rows.slice(1):rows;
 const nameOf=r=>fi>=0?[r[fi],li>=0?r[li]:""].filter(Boolean).join(" "):r[ni];
 if(ci>=0){
  const groups={};data.forEach(r=>{const n=nameOf(r);if(!n)return;const k=r[ci]||"ללא כיתה";(groups[k]=groups[k]||[]).push(n)});
  const names=Object.keys(groups);
  names.forEach(k=>{let c=S.classes.find(x=>x.name==k);if(!c){c={id:uid(),name:k,students:[],icon:{type:"emoji",value:"⭐"}};S.classes.push(c)}c.students=groups[k]});
  S.cur=S.classes.find(x=>x.name==names[0]).id;save();renderPanel();toast(`יובאו ${names.length} כיתות`);
 }else{
  const list=data.map(nameOf).filter(Boolean);const c=cls();
  if(c.students.length){confirmBox(`בכיתה כבר יש ${c.students.length} תלמידים. להחליף אותם ב-${list.length} השמות מהקובץ?`,()=>{c.students=list;save();renderPanel();toast(`יובאו ${list.length} תלמידים`)},"החלפה")}
  else{c.students=list;save();renderPanel();toast(`יובאו ${list.length} תלמידים`)}
 }
}
function parseCSV(t){const sep=(t.split("\n")[0].match(/;/g)||[]).length>(t.split("\n")[0].match(/,/g)||[]).length?";":(t.includes("\t")?"\t":",");
 const out=[];let row=[],cur="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch=='"')q=true; else if(ch==sep){row.push(cur);cur=""} else if(ch=="\n"){row.push(cur);out.push(row);row=[];cur=""} else if(ch!="\r")cur+=ch}
 if(cur||row.length){row.push(cur);out.push(row)}return out}

// ---------- 2. דף מדבקות ----------
function pSheet(){const s=S.sheet;
 const num=(k,l,step=0.01,min=0)=>`<div class="f"><label>${l}</label><input type="number" step="${step}" ${min===null?'':`min="${min}"`} data-s="${k}" value="${s[k]}"></div>`;
 return `<h3>דף המדבקות</h3>
 <div class="f"><label style="font-size:16px;color:var(--ink)">כמה מדבקות יש בדף?</label>
 <input type="number" min="1" max="400" step="1" id="sCount" value="${s.count}" style="font-size:24px;font-weight:700;text-align:center;padding:12px">
 <div class="hint" style="margin-top:6px">כותבים את המספר שמופיע על חבילת הדפים, למשל 24, 72 או 92. זה בדיוק מספר המדבקות שיודפס בכל דף.</div></div>
 <div class="note n-info" id="layoutMsg"></div>
 <details ${s.auto?'':'open'}><summary style="cursor:pointer;font-weight:700;color:var(--pri);margin:6px 0">📏 התאמה מדויקת למידות הדף (לא חובה)</summary>
 <div class="hint" style="margin-top:8px">אם ההדפסה לא יושבת בדיוק על המדבקות, מודדים את הדף עם סרגל ומקלידים בסנטימטרים.</div>
 <h4>פריסה</h4>
 <div class="g2">${num("cols","עמודות (לרוחב)",1,1)}<div class="f"><label>שורות (מחושב)</label><input disabled value="${s.rows}" id="sRows"></div></div>
 <h4>שוליים ורווחים</h4>
 <div class="g2">${num("top","שוליים עליונים (ס״מ)")}${num("side","שוליים צדדיים (ס״מ)")}${num("gapX","רווח בין עמודות (ס״מ)")}${num("gapY","רווח בין שורות (ס״מ)")}</div>
 <h4>גודל מדבקה אחת</h4>
 <label class="check"><input type="checkbox" id="sAuto" ${s.auto?'checked':''}> לחשב אוטומטית לפי הדף והשוליים</label>

function fitText(ctx,text,maxW,maxH,fam,wt,maxPx){

 if(words.length>1){let bestSplit=null;
  for(let i=1;i<words.length;i++){const a=words.slice(0,i).join(" "),b=words.slice(i).join(" ");
   let l2=4,h2=maxPx;const two=s=>{ctx.font=`${wt} ${s}px "${fam}"`;return Math.max(ctx.measureText(a).width,ctx.measureText(b).width)<=maxW&&2*s*lh<=maxH};
   for(let k=0;k<18;k++){const m=(l2+h2)/2;two(m)?l2=m:h2=m}
   if(!bestSplit||l2>bestSplit.size)bestSplit={lines:[a,b],size:l2}}

let pvTimer,pvIdx=0;
function schedulePreview(){clearTimeout(pvTimer);pvTimer=setTimeout(drawPreview,120)}
async function drawPreview(){
 await fontsReady();
 const pages=buildPages();
 if(pvIdx>=pages.length)pvIdx=0;
 $("#pvInfo").textContent=pages.length?`${cls().name} · ${pages.length} דפים · ${S.sheet.count} מדבקות בדף`:"";
 const big=$("#big");
 if(!pages.length){big.width=420;big.height=594;const x=big.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,420,594);x.fillStyle="#999";x.font="18px Assistant";x.textAlign="center";x.direction="rtl";x.fillText("אין מה להציג – הוסיפו תלמידים בשלב 1",210,297);$("#thumbs").innerHTML="";return}
 renderPage(big,110,pages[pvIdx]);big.style.width=Math.min(560,big.parentNode.clientWidth-36)+"px";
 const th=$("#thumbs");th.innerHTML="";
 const max=Math.min(pages.length,80);
 for(let i=0;i<max;i++){const d=document.createElement("div");d.className="thumb"+(i==pvIdx?" on":"");const cv=document.createElement("canvas");
  d.appendChild(cv);const t=document.createElement("div");t.textContent=`${i+1}. ${pages[i].title}`;d.appendChild(t);d.onclick=()=>{pvIdx=i;drawPreview()};th.appendChild(d)}
 // ציור הדרגתי של התמונות הקטנות
 let i=0;const step=()=>{const cvs=th.querySelectorAll("canvas");for(let n=0;n<6&&i<cvs.length;n++,i++)renderPage(cvs[i],24,pages[i]);if(i<cvs.length)requestAnimationFrame(step)};step();
 if(pages.length>max){const d=document.createElement("div");d.className="thumb";d.innerHTML=`<div style="padding-top:40px">ועוד ${pages.length-max} דפים…</div>`;th.appendChild(d)}
}

// ===================== PDF והדפסה =====================
function progress(on,frac,txt){$("#progBox")&&($("#progBox").style.display=on?"block":"none");if($("#prog"))$("#prog").style.width=(frac*100)+"%";if($("#progTxt"))$("#progTxt").textContent=txt||""}
const fileName=()=>`מדבקות - ${cls().name}.pdf`.replace(/[\\/:*?"<>|]/g,"-");
async function doPDF(){
 const pages=buildPages();if(!pages.length)return;
 await fontsReady();
 const cv=document.createElement("canvas"),imgs=[];
 for(let i=0;i<pages.length;i++){
  progress(true,i/pages.length,`מכין דף ${i+1} מתוך ${pages.length}…`);await new Promise(r=>setTimeout(r,0));
  renderPage(cv,S.print.dpi,pages[i]);
  const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
  imgs.push({data:new Uint8Array(await b.arrayBuffer()),w:cv.width,h:cv.height})}
 progress(true,1,"שומר את הקובץ…");
 await saveBlob(makePDF(imgs),fileName());
 progress(false);
}
// יצירת PDF פשוט: כל דף A4 הוא תמונה אחת בגודל מלא (בלי ספריות חיצוניות)
function makePDF(imgs){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const add=x=>{const u=typeof x=="string"?enc.encode(x):x;parts.push(u);len+=u.length};
 const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n`);body();add("\nendobj\n")};
 const W=595.28,H=841.89,n=imgs.length,pageIds=imgs.map((_,i)=>3+i*3);
 add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
 obj(1,()=>add("<< /Type /Catalog /Pages 2 0 R >>"));
 obj(2,()=>add(`<< /Type /Pages /Count ${n} /Kids [${pageIds.map(i=>i+" 0 R").join(" ")}] >>`));
 imgs.forEach((im,i)=>{const p=3+i*3,c=p+1,x=p+2,cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${x} 0 R >> >> /Contents ${c} 0 R >>`));
  obj(c,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  obj(x,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`);add(im.data);add("\nendstream")})});
 const total=3+n*3,xref=len;
 let t=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
 add(t+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"})}
async function saveBlob(blob,name){
 // בתוך Claude – דרך רכיב ההורדות; באתר רגיל – הורדה רגילה
 try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});toast("הקובץ נשמר");return}}}catch(e){if(e&&e.code=="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("קובץ ה-PDF ירד למחשב ✓");
}
async function doPrint(test){
 const pages=test?[{labels:[]}]:buildPages();if(!pages.length)return;
 await fontsReady();
 const area=$("#printArea");area.innerHTML="";const cv=document.createElement("canvas");
 for(let i=0;i<pages.length;i++){progress(true,i/pages.length,`מכין דף ${i+1} מתוך ${pages.length}…`);await new Promise(r=>setTimeout(r,0));
  renderPage(cv,test?150:S.print.dpi,pages[i],!!test);const im=new Image();im.src=cv.toDataURL("image/jpeg",0.92);area.appendChild(im)}
 progress(false);
 await Promise.all([...area.images||area.querySelectorAll("img")].map(im=>im.decode?im.decode().catch(()=>{}):0));
 try{window.print()}catch(e){infoBox("ההדפסה חסומה בתצוגה הזו. פתחו את הקובץ בדפדפן רגיל (כרום / אדג׳).")}
}
function printTest(){doPrint(true)}

// ===================== גיבוי ועזרה =====================
async function backup(){await saveBlob(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),"גיבוי-מדבקות.json")}
$("#restoreIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const d=JSON.parse(await f.text());if(!d.classes)throw 0;S={...structuredClone(DEF),...d};save();renderPanel();toast("השחזור הצליח")}catch(err){toast("קובץ הגיבוי לא תקין")}};
function closeM(){$("#modal").classList.remove("show")}
$("#modal").onclick=e=>{if(e.target.id=="modal")closeM()};
function infoBox(html){$("#modalBox").innerHTML=`<div style="line-height:1.7">${html}</div><div class="row" style="margin-top:16px"><button class="btn" onclick="closeM()">הבנתי</button></div>`;$("#modal").classList.add("show")}
function confirmBox(msg,ok,okText="מחיקה"){$("#modalBox").innerHTML=`<p style="font-size:17px">${msg}</p><div class="row"><button class="btn" id="okB">${okText}</button><button class="btn ghost" onclick="closeM()">ביטול</button></div>`;$("#modal").classList.add("show");$("#okB").onclick=()=>{closeM();ok()}}
function showHelp(){infoBox(`<h3 style="margin-top:0">איך משתמשים – 4 שלבים</h3>
<ol style="padding-right:20px">
<li><b>כיתות:</b> כותבים את שם הכיתה ומדביקים את שמות התלמידים (שם בכל שורה), או מייבאים קובץ אקסל.</li>
<li><b>סוג הדף:</b> כותבים כמה מדבקות יש בדף (לפי מה שכתוב על החבילה). אם צריך דיוק, מודדים עם סרגל ומדפיסים פעם אחת "דף בדיקת יישור" על נייר רגיל.</li>
<li><b>עיצוב:</b> בוחרים סמל לכיתה, גופן וצבע.</li>
<li><b>הדפסה:</b> השמות יוצאים לפי סדר הכיתה וחוזרים שוב ושוב עד שהדף מתמלא. לוחצים "הורדת PDF" או "הדפסה ישירה".</li></ol>
<p>בחלון ההדפסה חשוב לבחור <b>גודל בפועל / 100%</b>.</p>
<p style="color:var(--mute)">הכול נשמר אוטומטית בדפדפן הזה. כדי להעביר למחשב אחר – "גיבוי" ואז "שחזור".</p>`)}

renderPanel();
window.addEventListener("resize",schedulePreview);
document.fonts&&document.fonts.ready.then(schedulePreview);
</script>
